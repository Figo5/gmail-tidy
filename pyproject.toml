[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gmail-tidy"
version = "0.1.0"
description = "Privacy-conscious declarative cleanup for existing Gmail mail — label + archive only."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
  { name = "gmail-tidy contributors" },
]
keywords = ["gmail", "email", "cleanup", "privacy", "cli", "labels", "archive"]
classifiers = [
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Communications :: Email",
  "Topic :: Utilities",
]
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "pyyaml>=6.0",
  "pydantic>=2.6",
  "google-auth-oauthlib>=1.2",
  "google-api-python-client>=2.120",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
gmail-tidy = "gmail_tidy.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/gmail_tidy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
